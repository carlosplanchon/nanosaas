<!DOCTYPE html>
<html lang="en" data-root-prefix="{{ root_prefix }}">
<head>
    <meta charset="UTF-8">
    <title>User Panel</title>
    <link rel="icon" type="image/svg+xml" href="{{ static_url('nanosaas_logo.svg') }}">
    <!-- Include Alpine.js -->
    <script src="{{ static_url('alpine-3.17.4.min.js') }}" defer></script>
    <!-- Include Tailwind CSS -->
    <link rel="stylesheet" href="{{ static_url('tailwind.css') }}">
    <!-- Include the script that colors the results' JSON -->
    <script src="{{ static_url('json.js') }}"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="container mx-auto mt-10">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-700">User Panel</h1>
            <div class="flex gap-4">
                {% if is_admin %}
                <a href="{{ root_prefix }}/admin">
                    <button class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-md">
                        Admin
                    </button>
                </a>
                {% endif %}
                <a href="{{ root_prefix }}/user/api_key_page">
                    <button class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-md">
                        API Key Management
                    </button>
                </a>
                <form method="post" action="{{ root_prefix }}/auth/logout">
                    <button class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-md">
                        Logout
                    </button>
                </form>
            </div>
        </div>

        <!-- Alpine.js interactive scope -->
        <div x-data="taskManager()" class="bg-white p-6 rounded-lg shadow-md w-full mx-auto">
            <div class="mb-6 text-center">
                <span class="text-gray-700 font-semibold">Remaining Credits: </span>
                <span x-text="credits" class="text-blue-500 font-bold"></span>
            </div>

            <!-- Info Box: the chosen task's description -->
            <div x-show="chosenTask()?.description" class="bg-blue-100 border border-blue-300 text-blue-700 p-4 rounded-md mb-6">
                <p x-text="chosenTask()?.description"></p>
            </div>

            <!-- Task Input: the chosen task, and an input for each of its parameters -->
            <div class="flex flex-col md:flex-row items-center justify-center gap-4 mb-6">
                <label class="block text-gray-700">
                    Task:
                    <select x-model="chosen" x-on:change="resetValues()" class="mt-1 p-2 border rounded-md bg-white w-full md:w-48">
                        <template x-for="taskType in taskTypes" :key="taskType.name">
                            <option :value="taskType.name" :selected="taskType.name === chosen" x-text="taskType.name"></option>
                        </template>
                    </select>
                </label>
                <template x-for="parameter in chosenTask()?.parameters ?? []" :key="parameter.name">
                    <label class="block text-gray-700">
                        <span x-text="parameter.name"></span>:
                        <template x-if="inputKind(parameter) === 'select'">
                            <select x-model="values[parameter.name]" class="mt-1 p-2 border rounded-md bg-white w-full md:w-48">
                                <option value=""></option>
                                <template x-for="option in parameter.options" :key="JSON.stringify(option)">
                                    <option :value="JSON.stringify(option)" :selected="JSON.stringify(option) === values[parameter.name]" x-text="option"></option>
                                </template>
                            </select>
                        </template>
                        <template x-if="inputKind(parameter) === 'checkbox'">
                            <input type="checkbox" x-model="values[parameter.name]">
                        </template>
                        <template x-if="inputKind(parameter) === 'json'">
                            <textarea x-model="values[parameter.name]" placeholder="JSON" class="mt-1 p-2 border rounded-md w-full md:w-48"></textarea>
                        </template>
                        <template x-if="['number', 'text'].includes(inputKind(parameter))">
                            <input :type="inputKind(parameter)" x-model="values[parameter.name]" class="mt-1 p-2 border rounded-md w-full md:w-48">
                        </template>
                    </label>
                </template>
                <button x-on:click="startTask" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-md">
                    Start Task
                </button>
            </div>

            <!-- Tasks Table -->
            <div class="overflow-x-auto">
                <table class="table-auto w-full border-collapse border border-gray-300">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="border p-2">Task ID</th>
                            <th class="border p-2">Task</th>
                            <th class="border p-2">Parameters</th>
                            <th class="border p-2">Status</th>
                            <th class="border p-2">Result</th>
                            <th class="border p-2">Created At</th>
                            <th class="border p-2">Task details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="task in tasks" :key="task.task_id">
                            <tr class="hover:bg-gray-100">
                                <td class="border p-2 text-center" x-text="task.task_id"></td>
                                <td class="border p-2 text-center" x-text="task.task_type"></td>
                                <td class="border p-2 text-center" x-text="formatParameters(task.parameters)"></td>
                                <td class="border p-2 text-center">
                                    <span x-text="task.status"></span>
                                    <!-- Until a worker starts it, it can be canceled -->
                                    <template x-if="task.status === 'PENDING' && !task.started">
                                        <button x-on:click="cancelTask(task)" class="block mx-auto text-sm text-red-600 hover:underline">Cancel</button>
                                    </template>
                                </td>
                                <td class="border p-2 text-center" x-html="highlightJson(task.result)"></td>
                                <td class="border p-2 text-center" x-text="task.created_at"></td>
                                <td class="border p-2 text-center">
                                    <a :href="`{{ root_prefix }}/task_details/${task.task_id}`" class="text-blue-500 hover:underline">View Details</a>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- The pages of the history -->
            <div class="flex mt-4">
                <button x-show="pages.length > 1" x-on:click="newerTasks()" class="text-blue-500 hover:underline">&larr; Newer tasks</button>
                <button x-show="hasMore" x-on:click="olderTasks()" class="ml-auto text-blue-500 hover:underline">Older tasks &rarr;</button>
            </div>
        </div>

        <!-- Deleting the account: at the end, apart from the other buttons. It asks
             first, with Alpine.js: the Content-Security-Policy blocks onsubmit. -->
        <form method="post" action="{{ root_prefix }}/user/delete_account" class="my-10 text-center"
              x-data x-on:submit="confirm('Delete your account, with its tasks, its credits and its API key? This cannot be undone.') || $event.preventDefault()">
            <button class="text-sm text-red-600 hover:underline">Delete Account</button>
        </form>
    </div>

    <!-- Its script, from a file: the Content-Security-Policy blocks the ones written here -->
    <script src="{{ static_url('user_panel.js') }}"></script>
</body>
</html>
