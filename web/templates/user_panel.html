<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Panel</title>
    <link rel="icon" type="image/svg+xml" href="{{ root_prefix }}/web/static/nanosaas_logo.svg">
    <!-- Include Alpine.js -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js" integrity="sha384-5/joNqFnRyVWzXp99bHot6RHG+EksGp+USSgZwPar7T9SD9PKKER37n/8bXBAZGd" crossorigin="anonymous" defer></script>
    <!-- Include Tailwind CSS -->
    <link rel="stylesheet" href="{{ root_prefix }}/web/static/tailwind.css">
    <!-- Include Prism.js, to color the results' JSON -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism.min.css" integrity="sha384-rCCjoCPCsizaAAYVoz1Q0CmCTvnctK0JkfCSjx7IIxexTBg+uCKtFYycedUjMyA2" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-core.min.js" integrity="sha384-zLRFO4dwowZvh8kzutOb5AWhH7f39HeJp+N7PtHF1SQtTBnifRx0AtmvTYs3F4YV" crossorigin="anonymous" data-manual></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-json.min.js" integrity="sha384-RhrmFFMb0ZCHImjFMpR/UE3VEtIVTCtNrtKQqXCzqXZNJala02N3UbVhi+qzw3CY" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="container mx-auto mt-10">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-700">User Panel</h1>
            <div class="flex gap-4">
                <a href="{{ root_prefix }}/user/api_key_page">
                    <button class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-md">
                        API Key Management
                    </button>
                </a>
                <a href="{{ root_prefix }}/auth/logout">
                    <button class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-md">
                        Logout
                    </button>
                </a>
            </div>
        </div>

        <!-- Alpine.js interactive scope -->
        <div x-data="taskManager()" class="bg-white p-6 rounded-lg shadow-md w-full mx-auto">
            <div class="mb-6 text-center">
                <span class="text-gray-700 font-semibold">Remaining Credits: </span>
                <span x-text="credits" class="text-blue-500 font-bold"></span>
            </div>

            <!-- Info Box: the chosen task's description -->
            <div x-show="chosenTask()?.description" class="bg-blue-100 border border-blue-300 text-blue-700 p-4 rounded-md mb-6">
                <p x-text="chosenTask()?.description"></p>
            </div>

            <!-- Task Input: the chosen task, and an input for each of its parameters -->
            <div class="flex flex-col md:flex-row items-center justify-center gap-4 mb-6">
                <label class="block text-gray-700">
                    Task:
                    <select x-model="chosen" x-on:change="resetValues()" class="mt-1 p-2 border rounded-md bg-white w-full md:w-48">
                        <template x-for="taskType in taskTypes" :key="taskType.name">
                            <option :value="taskType.name" :selected="taskType.name === chosen" x-text="taskType.name"></option>
                        </template>
                    </select>
                </label>
                <template x-for="parameter in chosenTask()?.parameters ?? []" :key="parameter.name">
                    <label class="block text-gray-700">
                        <span x-text="parameter.name"></span>:
                        <input :type="isNumber(parameter) ? 'number' : 'text'" x-model="values[parameter.name]" class="mt-1 p-2 border rounded-md w-full md:w-48">
                    </label>
                </template>
                <button x-on:click="startTask" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-md">
                    Start Task
                </button>
            </div>

            <!-- Tasks Table -->
            <div class="overflow-x-auto">
                <table class="table-auto w-full border-collapse border border-gray-300">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="border p-2">Task ID</th>
                            <th class="border p-2">Task</th>
                            <th class="border p-2">Parameters</th>
                            <th class="border p-2">Status</th>
                            <th class="border p-2">Result</th>
                            <th class="border p-2">Created At</th>
                            <th class="border p-2">Task details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="task in tasks" :key="task.id">
                            <tr class="hover:bg-gray-100">
                                <td class="border p-2 text-center" x-text="task.task_id"></td>
                                <td class="border p-2 text-center" x-text="task.task_type"></td>
                                <td class="border p-2 text-center" x-text="formatParameters(task.parameters)"></td>
                                <td class="border p-2 text-center" x-text="task.status"></td>
                                <td class="border p-2 text-center" x-html="highlightJson(task.result)"></td>
                                <td class="border p-2 text-center" x-text="task.created_at"></td>
                                <td class="border p-2 text-center">
                                    <a :href="`{{ root_prefix }}/task_details/${task.task_id}`" class="text-blue-500 hover:underline">View Details</a>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // When the session expires, go back to the login page.
        function sessionExpired(response) {
            if (response.status !== 401) {
                return false;
            }
            window.location.href = '{{ root_prefix }}/';
            return true;
        }

        // The value as JSON, colored by Prism, which escapes it first.
        function highlightJson(value) {
            return Prism.highlight(JSON.stringify(value ?? null, null, 2), Prism.languages.json, 'json');
        }

        // A task's parameters, like "x: 6, y: 3".
        function formatParameters(parameters) {
            return Object.entries(parameters ?? {}).map(([name, value]) => `${name}: ${JSON.stringify(value)}`).join(', ');
        }

        // The JSON schema types that get a number input.
        function isNumber(parameter) {
            return ['integer', 'number'].includes(parameter.type);
        }

        function taskManager() {
            let timer = null;

            return {
                taskTypes: [], // The tasks the user can start, from /user/tasks
                chosen: '',
                values: {},
                tasks: [],
                credits: 0, // Initialize credits
                // The task being started, and the Idempotency-Key it's sent with: sent
                // again before an answer, after a double click or a network error, it
                // gets the same task instead of starting and paying for another one.
                sending: null,

                init() {
                    this.fetchTaskTypes();
                    this.refresh();

                    // Don't poll while the tab is hidden, and catch up when it shows again.
                    document.addEventListener('visibilitychange', () => {
                        if (document.hidden) {
                            clearTimeout(timer);
                        } else {
                            this.refresh();
                        }
                    });
                },

                // Every 5 seconds while a task is pending, every 30 otherwise.
                async refresh() {
                    // History first, so the credits count the refunds of the finished tasks it shows.
                    await this.fetchTaskHistory();
                    await this.fetchCredits();
                    if (document.hidden) return;

                    const busy = this.tasks.some(task => task.status === 'PENDING');
                    clearTimeout(timer);
                    timer = setTimeout(() => this.refresh(), busy ? 5000 : 30000);
                },

                async fetchCredits() {
                    try {
                        const response = await fetch('{{ root_prefix }}/user/credits');
                        if (sessionExpired(response)) return;
                        if (response.ok) {
                            const data = await response.json();
                            this.credits = data.credits;
                        } else {
                            console.error('Failed to fetch credits');
                            this.credits = 'Error';
                        }
                    } catch (error) {
                        console.error('Error fetching credits:', error);
                        this.credits = 'Error';
                    }
                },

                async fetchTaskHistory() {
                    try {
                        const response = await fetch('{{ root_prefix }}/user/task_history');
                        if (sessionExpired(response)) return;
                        if (response.ok) {
                            const data = await response.json();
                            this.tasks = data.map(task => ({
                                ...task,
                                created_at: new Date(task.created_at).toLocaleString()
                            }));
                        } else {
                            console.error('Failed to fetch task history');
                        }
                    } catch (error) {
                        console.error('Error fetching task history:', error);
                    }
                },

                chosenTask() {
                    return this.taskTypes.find(taskType => taskType.name === this.chosen);
                },

                // Each parameter starts with its default, if it has one.
                resetValues() {
                    const parameters = this.chosenTask()?.parameters ?? [];
                    this.values = Object.fromEntries(parameters.map(parameter => [parameter.name, parameter.default ?? '']));
                },

                async fetchTaskTypes() {
                    try {
                        const response = await fetch('{{ root_prefix }}/user/tasks');
                        if (sessionExpired(response)) return;
                        if (response.ok) {
                            this.taskTypes = await response.json();
                            this.chosen = this.taskTypes[0]?.name ?? '';
                            this.resetValues();
                        } else {
                            console.error('Failed to fetch the tasks');
                        }
                    } catch (error) {
                        console.error('Error fetching the tasks:', error);
                    }
                },

                async startTask() {
                    const taskType = this.chosenTask();
                    if (!taskType) return;

                    // Numbers go as numbers, and empty inputs are left out, so the task's defaults apply.
                    const parameters = {};
                    for (const parameter of taskType.parameters) {
                        const value = this.values[parameter.name];
                        if (value === '' || value === null || value === undefined) continue;
                        parameters[parameter.name] = isNumber(parameter) ? Number(value) : value;
                    }

                    // Another task or other parameters: a new key.
                    const request = JSON.stringify([taskType.name, parameters]);
                    if (this.sending?.request !== request) {
                        this.sending = { request, key: crypto.randomUUID() };
                    }

                    try {
                        const response = await fetch(`{{ root_prefix }}/task/${encodeURIComponent(taskType.name)}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Idempotency-Key': this.sending.key },
                            body: JSON.stringify(parameters)
                        });
                        // Answered: starting it again starts another task.
                        this.sending = null;
                        if (sessionExpired(response)) return;

                        if (response.ok) {
                            this.refresh(); // Refresh task history and credits after starting a new task
                        } else if (response.status === 403) {
                            alert('Not enough credits');
                        } else if (response.status === 422) {
                            const data = await response.json();
                            alert('Check the parameters: ' + data.detail.map(error => `${error.loc.at(-1)}: ${error.msg}`).join(', '));
                        } else {
                            alert('Failed to start task');
                        }
                    } catch (error) {
                        console.error('Error starting task:', error);
                        alert('An error occurred while starting the task.');
                    }
                }
            };
        }
    </script>
</body>
</html>
