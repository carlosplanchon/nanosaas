<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Panel</title>
    <link rel="icon" type="image/svg+xml" href="{{ static_url('nanosaas_logo.svg') }}">
    <!-- Include Alpine.js -->
    <script src="{{ static_url('alpine-3.17.4.min.js') }}" defer></script>
    <!-- Include Tailwind CSS -->
    <link rel="stylesheet" href="{{ static_url('tailwind.css') }}">
    <!-- Include the script that colors the results' JSON -->
    <script src="{{ static_url('json.js') }}"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="container mx-auto mt-10">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-700">User Panel</h1>
            <div class="flex gap-4">
                {% if is_admin %}
                <a href="{{ root_prefix }}/admin">
                    <button class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-md">
                        Admin
                    </button>
                </a>
                {% endif %}
                <a href="{{ root_prefix }}/user/api_key_page">
                    <button class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-md">
                        API Key Management
                    </button>
                </a>
                <form method="post" action="{{ root_prefix }}/auth/logout">
                    <button class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-md">
                        Logout
                    </button>
                </form>
            </div>
        </div>

        <!-- Alpine.js interactive scope -->
        <div x-data="taskManager()" class="bg-white p-6 rounded-lg shadow-md w-full mx-auto">
            <div class="mb-6 text-center">
                <span class="text-gray-700 font-semibold">Remaining Credits: </span>
                <span x-text="credits" class="text-blue-500 font-bold"></span>
            </div>

            <!-- Info Box: the chosen task's description -->
            <div x-show="chosenTask()?.description" class="bg-blue-100 border border-blue-300 text-blue-700 p-4 rounded-md mb-6">
                <p x-text="chosenTask()?.description"></p>
            </div>

            <!-- Task Input: the chosen task, and an input for each of its parameters -->
            <div class="flex flex-col md:flex-row items-center justify-center gap-4 mb-6">
                <label class="block text-gray-700">
                    Task:
                    <select x-model="chosen" x-on:change="resetValues()" class="mt-1 p-2 border rounded-md bg-white w-full md:w-48">
                        <template x-for="taskType in taskTypes" :key="taskType.name">
                            <option :value="taskType.name" :selected="taskType.name === chosen" x-text="taskType.name"></option>
                        </template>
                    </select>
                </label>
                <template x-for="parameter in chosenTask()?.parameters ?? []" :key="parameter.name">
                    <label class="block text-gray-700">
                        <span x-text="parameter.name"></span>:
                        <template x-if="inputKind(parameter) === 'select'">
                            <select x-model="values[parameter.name]" class="mt-1 p-2 border rounded-md bg-white w-full md:w-48">
                                <option value=""></option>
                                <template x-for="option in parameter.options" :key="JSON.stringify(option)">
                                    <option :value="JSON.stringify(option)" :selected="JSON.stringify(option) === values[parameter.name]" x-text="option"></option>
                                </template>
                            </select>
                        </template>
                        <template x-if="inputKind(parameter) === 'checkbox'">
                            <input type="checkbox" x-model="values[parameter.name]">
                        </template>
                        <template x-if="inputKind(parameter) === 'json'">
                            <textarea x-model="values[parameter.name]" placeholder="JSON" class="mt-1 p-2 border rounded-md w-full md:w-48"></textarea>
                        </template>
                        <template x-if="['number', 'text'].includes(inputKind(parameter))">
                            <input :type="inputKind(parameter)" x-model="values[parameter.name]" class="mt-1 p-2 border rounded-md w-full md:w-48">
                        </template>
                    </label>
                </template>
                <button x-on:click="startTask" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-md">
                    Start Task
                </button>
            </div>

            <!-- Tasks Table -->
            <div class="overflow-x-auto">
                <table class="table-auto w-full border-collapse border border-gray-300">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="border p-2">Task ID</th>
                            <th class="border p-2">Task</th>
                            <th class="border p-2">Parameters</th>
                            <th class="border p-2">Status</th>
                            <th class="border p-2">Result</th>
                            <th class="border p-2">Created At</th>
                            <th class="border p-2">Task details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="task in tasks" :key="task.task_id">
                            <tr class="hover:bg-gray-100">
                                <td class="border p-2 text-center" x-text="task.task_id"></td>
                                <td class="border p-2 text-center" x-text="task.task_type"></td>
                                <td class="border p-2 text-center" x-text="formatParameters(task.parameters)"></td>
                                <td class="border p-2 text-center">
                                    <span x-text="task.status"></span>
                                    <!-- Until a worker starts it, it can be canceled -->
                                    <template x-if="task.status === 'PENDING' && !task.started">
                                        <button x-on:click="cancelTask(task)" class="block mx-auto text-sm text-red-600 hover:underline">Cancel</button>
                                    </template>
                                </td>
                                <td class="border p-2 text-center" x-html="highlightJson(task.result)"></td>
                                <td class="border p-2 text-center" x-text="task.created_at"></td>
                                <td class="border p-2 text-center">
                                    <a :href="`{{ root_prefix }}/task_details/${task.task_id}`" class="text-blue-500 hover:underline">View Details</a>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- The pages of the history -->
            <div class="flex mt-4">
                <button x-show="pages.length > 1" x-on:click="newerTasks()" class="text-blue-500 hover:underline">&larr; Newer tasks</button>
                <button x-show="hasMore" x-on:click="olderTasks()" class="ml-auto text-blue-500 hover:underline">Older tasks &rarr;</button>
            </div>
        </div>

        <!-- Deleting the account: at the end, apart from the other buttons -->
        <form method="post" action="{{ root_prefix }}/user/delete_account" class="my-10 text-center"
              onsubmit="return confirm('Delete your account, with its tasks, its credits and its API key? This cannot be undone.')">
            <button class="text-sm text-red-600 hover:underline">Delete Account</button>
        </form>
    </div>

    <script>
        // When the session expires, go back to the login page.
        function sessionExpired(response) {
            if (response.status !== 401) {
                return false;
            }
            window.location.href = '{{ root_prefix }}/';
            return true;
        }

        // A task's parameters, like "x: 6, y: 3".
        function formatParameters(parameters) {
            return Object.entries(parameters ?? {}).map(([name, value]) => `${name}: ${JSON.stringify(value)}`).join(', ');
        }

        // A parameter's input: a list to choose from, for an enum or a Literal,
        // or else the one of its JSON schema type. Lists, and objects like dicts
        // and models, are typed as JSON.
        function inputKind(parameter) {
            if (parameter.options) return 'select';
            if (parameter.type === 'boolean') return 'checkbox';
            if (['array', 'object'].includes(parameter.type)) return 'json';
            if (['integer', 'number'].includes(parameter.type)) return 'number';
            return 'text';
        }

        // Text that isn't JSON goes as it is, and the server says what's wrong with it.
        function parseJson(text) {
            try {
                return JSON.parse(text);
            } catch {
                return text;
            }
        }

        // What a parameter's input starts with: its default, if it has one, as
        // JSON for lists, objects and choices (an option's value is JSON, so a
        // number stays a number). A checkbox without one starts unchecked.
        function initialValue(parameter) {
            const kind = inputKind(parameter);
            if (kind === 'checkbox') return parameter.default ?? false;
            if (parameter.default === null || parameter.default === undefined) return '';
            return ['json', 'select'].includes(kind) ? JSON.stringify(parameter.default) : parameter.default;
        }

        function taskManager() {
            let timer = null;

            return {
                taskTypes: [], // The tasks the user can start, from /user/tasks
                chosen: '',
                values: {},
                tasks: [],
                // The page of the history shown, as the task its tasks come before (null
                // for the first page), after the ones of the newer pages, to go back.
                pages: [null],
                hasMore: false, // Whether there are older tasks
                credits: 0, // Initialize credits
                // The task being started, and the Idempotency-Key it's sent with: sent
                // again before an answer, after a double click or a network error, it
                // gets the same task instead of starting and paying for another one.
                sending: null,

                init() {
                    this.fetchTaskTypes();
                    this.refresh();

                    // Don't poll while the tab is hidden, and catch up when it shows again.
                    document.addEventListener('visibilitychange', () => {
                        if (document.hidden) {
                            clearTimeout(timer);
                        } else {
                            this.refresh();
                        }
                    });
                },

                // Every 5 seconds while a task is pending, every 30 otherwise.
                async refresh() {
                    // History first, so the credits count the refunds of the finished tasks it shows.
                    await this.fetchTaskHistory();
                    await this.fetchCredits();
                    if (document.hidden) return;

                    const busy = this.tasks.some(task => task.status === 'PENDING');
                    clearTimeout(timer);
                    timer = setTimeout(() => this.refresh(), busy ? 5000 : 30000);
                },

                async fetchCredits() {
                    try {
                        const response = await fetch('{{ root_prefix }}/user/credits');
                        if (sessionExpired(response)) return;
                        if (response.ok) {
                            const data = await response.json();
                            this.credits = data.credits;
                        } else {
                            console.error('Failed to fetch credits');
                            this.credits = 'Error';
                        }
                    } catch (error) {
                        console.error('Error fetching credits:', error);
                        this.credits = 'Error';
                    }
                },

                // The page shown, so a refresh shows the latest of its tasks.
                async fetchTaskHistory() {
                    const before = this.pages.at(-1);
                    const query = before ? `?before=${encodeURIComponent(before)}` : '';
                    try {
                        const response = await fetch(`{{ root_prefix }}/user/task_history${query}`);
                        if (sessionExpired(response)) return;
                        // Another page was chosen meanwhile: this one is not shown anymore.
                        if (before !== this.pages.at(-1)) return;
                        if (response.ok) {
                            const data = await response.json();
                            this.tasks = data.tasks.map(task => ({
                                ...task,
                                created_at: new Date(task.created_at).toLocaleString()
                            }));
                            this.hasMore = data.has_more;
                        } else {
                            console.error('Failed to fetch task history');
                        }
                    } catch (error) {
                        console.error('Error fetching task history:', error);
                    }
                },

                // The tasks before the last one shown.
                olderTasks() {
                    this.pages.push(this.tasks.at(-1).task_id);
                    this.refresh();
                },

                newerTasks() {
                    this.pages.pop();
                    this.refresh();
                },

                chosenTask() {
                    return this.taskTypes.find(taskType => taskType.name === this.chosen);
                },

                resetValues() {
                    const parameters = this.chosenTask()?.parameters ?? [];
                    this.values = Object.fromEntries(parameters.map(parameter => [parameter.name, initialValue(parameter)]));
                },

                async fetchTaskTypes() {
                    try {
                        const response = await fetch('{{ root_prefix }}/user/tasks');
                        if (sessionExpired(response)) return;
                        if (response.ok) {
                            this.taskTypes = await response.json();
                            this.chosen = this.taskTypes[0]?.name ?? '';
                            this.resetValues();
                        } else {
                            console.error('Failed to fetch the tasks');
                        }
                    } catch (error) {
                        console.error('Error fetching the tasks:', error);
                    }
                },

                async startTask() {
                    const taskType = this.chosenTask();
                    if (!taskType) return;

                    // Numbers go as numbers, lists, objects and choices as their JSON,
                    // and empty inputs are left out, so the task's defaults apply.
                    const parameters = {};
                    for (const parameter of taskType.parameters) {
                        let value = this.values[parameter.name];
                        if (value === '' || value === null || value === undefined) continue;
                        const kind = inputKind(parameter);
                        if (kind === 'number') value = Number(value);
                        if (['json', 'select'].includes(kind)) value = parseJson(value);
                        parameters[parameter.name] = value;
                    }

                    // Another task or other parameters: a new key.
                    const request = JSON.stringify([taskType.name, parameters]);
                    if (this.sending?.request !== request) {
                        this.sending = { request, key: crypto.randomUUID() };
                    }

                    try {
                        const response = await fetch(`{{ root_prefix }}/task/${encodeURIComponent(taskType.name)}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Idempotency-Key': this.sending.key },
                            body: JSON.stringify(parameters)
                        });
                        // Answered: starting it again starts another task.
                        this.sending = null;
                        if (sessionExpired(response)) return;

                        if (response.ok) {
                            // Back to the first page, which has the new task.
                            this.pages = [null];
                            this.refresh(); // Refresh task history and credits after starting a new task
                        } else if (response.status === 403) {
                            alert('Not enough credits');
                        } else if (response.status === 422) {
                            const data = await response.json();
                            // Where the error is, like "numbers.1" for an item of a list.
                            alert('Check the parameters: ' + data.detail.map(error => `${error.loc.slice(1).join('.')}: ${error.msg}`).join(', '));
                        } else {
                            alert('Failed to start task');
                        }
                    } catch (error) {
                        console.error('Error starting task:', error);
                        alert('An error occurred while starting the task.');
                    }
                },

                // Its credit comes back. A worker may have started it meanwhile: then it can't.
                async cancelTask(task) {
                    try {
                        const response = await fetch(`{{ root_prefix }}/task/cancel/${task.task_id}`, { method: 'POST' });
                        if (sessionExpired(response)) return;
                        if (response.status === 409) {
                            alert('The task already started, so it cannot be canceled.');
                        } else if (!response.ok) {
                            alert('Failed to cancel the task');
                        }
                    } catch (error) {
                        console.error('Error canceling task:', error);
                        alert('An error occurred while canceling the task.');
                    }
                    this.refresh();
                }
            };
        }
    </script>
</body>
</html>
