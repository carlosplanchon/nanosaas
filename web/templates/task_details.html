<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Details</title>
    <link rel="icon" type="image/svg+xml" href="{{ root_prefix }}/web/static/nanosaas_logo.svg">
    <!-- Include Tailwind CSS -->
    <link rel="stylesheet" href="{{ root_prefix }}/web/static/tailwind.css">
    <!-- Include Alpine.js -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js" integrity="sha384-5/joNqFnRyVWzXp99bHot6RHG+EksGp+USSgZwPar7T9SD9PKKER37n/8bXBAZGd" crossorigin="anonymous" defer></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="container mx-auto mt-10" x-data="taskDetails('{{ task_id }}')" x-init="fetchTaskDetails()">
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h1 class="text-3xl font-bold text-gray-700 mb-4">Task Details</h1>
            <p class="text-gray-700"><strong>Task ID:</strong> <span x-text="task.task_id"></span></p>
            <p class="text-gray-700"><strong>Task Type:</strong> <span x-text="task.task_type"></span></p>
            <p class="text-gray-700"><strong>Parameters:</strong> <span x-text="JSON.stringify(task.parameters, null, 2)"></span></p>
            <p class="text-gray-700"><strong>Status:</strong> <span x-text="task.status"></span></p>
            <p class="text-gray-700"><strong>Result:</strong> <span x-text="JSON.stringify(task.result, null, 2)"></span></p>
            <p class="text-gray-700"><strong>Created At:</strong> <span x-text="task.created_at"></span></p>
            <a href="{{ root_prefix }}/userpanel" class="mt-4 inline-block bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-md">
                Back to Dashboard
            </a>
        </div>
    </div>
    <script>
        // When the session expires, go back to the login page.
        function sessionExpired(response) {
            if (response.status !== 401) {
                return false;
            }
            window.location.href = '{{ root_prefix }}/';
            return true;
        }

        function taskDetails(taskId) {
            return {
                task: {
                    task_id: '',
                    task_type: '',
                    parameters: null,
                    status: '',
                    result: '',
                    created_at: ''
                },
                fetchTaskDetails() {
                    const updateInterval = 5000; // 5 seconds
                    const fetchDetails = () => {
                        fetch(`{{ root_prefix }}/api/task_details_from_user/${taskId}`)
                            .then(response => {
                                if (sessionExpired(response)) {
                                    throw new Error('Session expired');
                                }
                                if (!response.ok) {
                                    throw new Error(`HTTP error! Status: ${response.status}`);
                                }
                                return response.json();
                            })
                            .then(data => {
                                this.task = data;
                            })
                            .catch(error => console.error('Error fetching task details:', error));
                    };

                    // Fetch immediately and set up interval
                    fetchDetails();
                    setInterval(fetchDetails, updateInterval);
                }
            };
        }
    </script>
</body>
</html>
