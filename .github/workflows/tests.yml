name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python (it needs tomllib) and the newest one.
        python-version: ["3.11", "3.15"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # uv, with that Python, and a cache of the packages it downloads.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          # The Dockerfile's.
          version: "0.13.5"
          python-version: ${{ matrix.python-version }}

      # Exactly as uv.lock has them, with the tests': it fails if pyproject.toml
      # changed without it.
      - name: Install dependencies
        run: uv sync --locked

      # The tests start PostgreSQL and Redis in Docker, which the runner has.
      - name: Run the tests
        run: uv run --locked pytest --basetemp="$RUNNER_TEMP/pytest"

      # The API and worker logs, to see what happened when a test fails.
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/pytest/**/*.log
          if-no-files-found: ignore

  # The app as compose.yaml runs it, with the config.toml of the README.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Write config.toml
        run: |
          key=$(python3 scripts/generate_jwt_secret_key.py)
          sed "s|^JWT_SIGNING_SECRET_KEY = .*|JWT_SIGNING_SECRET_KEY = \"$key\"|" config_template.toml > config.toml

      - name: Start the app
        run: docker compose up --build --detach --wait

      # From a new API key to the tasks' results, through the published port.
      - name: Run tasks
        shell: bash
        run: |
          api=http://127.0.0.1:8000
          # The API applies the migrations before it answers.
          curl --silent --fail --retry 30 --retry-all-errors --retry-delay 1 --output /dev/null "$api/openapi.json"
          # Whole outputs, and then grep: grep --quiet stops reading at the first match,
          # so a command still writing into it fails, and pipefail fails the step.
          page=$(curl --silent --fail "$api/")
          grep --quiet "Login with Google" <<< "$page"
          curl --silent --fail --output /dev/null "$api/web/static/tailwind.css"
          migrations=$(docker compose exec -T postgres psql -U nanosaas -tAc "SELECT name FROM tortoise_migrations")
          grep --quiet 0001_initial <<< "$migrations"

          # Stored like the app does: "first 8 characters$SHA-256".
          key=$(openssl rand -hex 32)
          stored="${key:0:8}\$$(printf %s "$key" | sha256sum | cut -d ' ' -f 1)"
          docker compose exec -T postgres psql -U nanosaas -v ON_ERROR_STOP=1 -c "
            WITH new_account AS (
              INSERT INTO account (google_id, email, picture, provider, created_at, credits)
              VALUES ('ci', 'ci@example.com', '', 'google', now(), 25) RETURNING id)
            INSERT INTO apikey (account_id, name, key_hash, created_at)
            SELECT id, 'CI', '$stored', now() FROM new_account"

          request() { curl --silent --fail --header "X-API-Key: $key" "$api$1" "${@:2}"; }
          divide() {
            local task details
            task=$(request /api/task/divide --header "Content-Type: application/json" --data "{\"x\": $1, \"y\": $2}" | jq -r .id)
            for _ in $(seq 30); do
              details=$(request "/api/task_details/$task")
              [ "$(jq -r .status <<< "$details")" != PENDING ] && break
              sleep 1
            done
            jq -c .result <<< "$details"
          }

          result=$(divide 10 4)
          echo "10 / 4: $result"
          [ "$result" = 2.5 ]
          # It fails with a TaskError, and the worker gives its credit back.
          result=$(divide 1 0)
          echo "1 / 0: $result"
          [ "$(jq -r .error <<< "$result")" = TaskError ]
          credits=$(request /api/user_credits | jq .credits)
          echo "Credits: $credits"
          [ "$credits" = 24 ]

          # Like the README says to add credits.
          docker compose exec -T api python scripts/add_credits.py ci@example.com 5
          credits=$(request /api/user_credits | jq .credits)
          echo "Credits after adding 5: $credits"
          [ "$credits" = 29 ]

      # A task's event, for a webhook at the API's container, whose address is private:
      # the worker checks the addresses before each attempt, so it isn't sent.
      - name: Check a webhook
        shell: bash
        run: |
          query() { docker compose exec -T postgres psql -U nanosaas -tAc "$1"; }
          key=$(openssl rand -hex 32)
          stored="${key:0:8}\$$(printf %s "$key" | sha256sum | cut -d ' ' -f 1)"
          query "WITH new_account AS (
                   INSERT INTO account (google_id, email, picture, provider, created_at, credits)
                   VALUES ('hook', 'hook@example.com', '', 'google', now(), 5) RETURNING id)
                 INSERT INTO apikey (account_id, name, key_hash, created_at)
                 SELECT id, 'CI', '$stored', now() FROM new_account" > /dev/null
          # Straight in the database: the API checks the URL too, and wouldn't take it.
          query "INSERT INTO webhook (account_id, url, secret, created_at)
                 SELECT id, 'https://api:8000/hook', 'whsec_$(openssl rand -base64 32)', now()
                 FROM account WHERE google_id = 'hook'" > /dev/null
          curl --silent --fail --header "X-API-Key: $key" --header "Content-Type: application/json" \
            --data '{"x": 6, "y": 3}' --output /dev/null http://127.0.0.1:8000/api/task/divide
          for _ in $(seq 30); do
            answer=$(query "SELECT last_response FROM webhookdelivery WHERE type = 'task.ended' ORDER BY id DESC LIMIT 1")
            [ -n "$answer" ] && break
            sleep 1
          done
          echo "The webhook's last attempt: $answer"
          [ "$answer" = "api has a private address" ]

      # As the README says: a backup, a mistake, and the backup restored.
      - name: Back up and restore the database
        shell: bash
        run: |
          query() { docker compose exec -T postgres psql -U nanosaas -tAc "$1"; }
          data="SELECT (SELECT count(*) FROM account), (SELECT sum(credits) FROM account), (SELECT count(*) FROM taskhistory)"
          docker compose exec -T backup sh /backup.sh once
          backup=$(docker compose exec -T backup ls /backups | tail -n 1)
          before=$(query "$data")
          # The accounts, and their tasks with them.
          query "DELETE FROM account"
          docker compose stop api worker
          docker compose exec -T backup sh /backup.sh restore "$backup"
          docker compose up --detach --wait
          after=$(query "$data")
          echo "Before the mistake: $before. After restoring $backup: $after"
          [ "$before" = "$after" ]

          # Only the latest BACKUP_KEEP stay.
          for _ in 1 2 3; do
            sleep 1
            docker compose exec -T -e BACKUP_KEEP=2 backup sh /backup.sh once
          done
          [ "$(docker compose exec -T backup ls /backups | wc -l)" = 2 ]

      # Caddy, with a certificate of its own for localhost, DOMAIN's default.
      - name: Serve it over HTTPS
        env:
          COMPOSE_PROFILES: https
        run: |
          docker compose up --detach --wait
          curl --silent --fail --insecure --retry 30 --retry-all-errors --retry-delay 1 https://localhost/ | grep --quiet "Login with Google"
          [ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/)" = 308 ]

      - name: Show the logs
        if: failure()
        env:
          COMPOSE_PROFILES: https
        run: docker compose logs
