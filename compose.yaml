# The whole app: PostgreSQL, with its backups, Redis, the backend and a TaskIQ worker.
name: nanosaas

x-app: &app
  build: .
  configs:
    - source: config
      target: /app/config.toml
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: &postgres postgres:17-alpine
    # Only the other containers reach it. If you change these, change config.toml too.
    environment:
      POSTGRES_USER: &db-user nanosaas
      POSTGRES_PASSWORD: &db-password nanosaas
      POSTGRES_DB: &db-name nanosaas
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: while it initializes, it only listens on a socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "nanosaas", "-d", "nanosaas"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  # Backs up the database once a day, keeping the latest 7, in the backups
  # volume: see the README's Backups.
  backup:
    # The database's image: its pg_dump is of the same version.
    image: *postgres
    command: sh /backup.sh
    environment:
      PGHOST: postgres
      PGUSER: *db-user
      PGPASSWORD: *db-password
      PGDATABASE: *db-name
    configs:
      - source: backup
        target: /backup.sh
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Writes every change to disk within a second, in its append-only file, so the
    # queued tasks survive a restart, and a crash. A Redis that only saved snapshots
    # before needs a step first, or it starts empty: see the README's Development Notes.
    command: redis-server --appendonly yes --appendfsync everysec --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  api:
    <<: *app
    ports:
      # Only reachable from this machine: Docker-published ports skip firewalls like ufw.
      - 127.0.0.1:8000:8000
    healthcheck:
      # /health answers once the migrations are applied, and with an error while PostgreSQL
      # or Redis doesn't answer it. Every second while it starts, then every 30.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      start_period: 60s
      start_interval: 1s

  worker:
    <<: *app
    command: taskiq worker taskiq_task:broker --receiver taskiq_task:Receiver

  # Only with --profile https: serves the app over HTTPS, on the ports 80 and 443 of the server.
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      # The certificates.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      # So it doesn't answer 502 while the API starts.
      api:
        condition: service_healthy
    restart: unless-stopped

configs:
  config:
    file: ./config.toml
  caddyfile:
    file: ./Caddyfile
  backup:
    file: ./scripts/backup_database.sh

volumes:
  postgres-data:
  backups:
  redis-data:
  caddy-data:
  caddy-config:
